spring.application.name=smart-support
server.address=127.0.0.1
server.port=${APP_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_support?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:support_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.mvc.problemdetails.enabled=true
spring.task.scheduling.pool.size=2

support.ai.url=${LLM_BASE_URL:https://api.openai.com/v1}
support.ai.key=${LLM_API_KEY:}
support.ai.model=${LLM_MODEL:gpt-4.1-mini}

support.demo.password=${DEMO_PASSWORD:}
support.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
support.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
support.agent.email=${BOOTSTRAP_AGENT_EMAIL:}
support.agent.password=${BOOTSTRAP_AGENT_PASSWORD:}